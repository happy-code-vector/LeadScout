# Render Blueprint: one web service running the Next.js app and the worker
# together, with a persistent disk for the SQLite database. Both processes
# must share one service — separate services get separate disks.
services:
  - type: web
    name: leadscout
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx tsx scripts/start-all.ts
    disk:
      name: leadscout-data
      mountPath: /opt/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: "file:/opt/data/leadscout.db"
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_ENABLED
        value: "true"
      - key: APP_BASE_URL
        value: "" # set to your Render URL, e.g. https://leadscout.onrender.com
      - key: AUTH_SECRET
        generateValue: true # or set your own: openssl rand -base64 32
      - key: GOOGLE_PLACES_API_KEY
        sync: false # empty = mock mode
      - key: LOB_API_KEY
        sync: false # empty disables the postal channel
      - key: ENCRYPTION_KEY
        sync: false # set explicitly (32-byte base64): node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
        # Must stay stable across deploys — mailbox passwords are encrypted with it.
      - key: UNSUBSCRIBE_JWT_SECRET
        sync: false # set a long random string
      - key: ROOT_EMAIL
        sync: false # initial root login (read only until the password is changed in-app)
      - key: ROOT_PASSWORD
        sync: false # min 8 chars; ignored once root's DB password exists
