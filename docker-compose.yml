services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadscout
      POSTGRES_PASSWORD: leadscout
      POSTGRES_DB: leadscout
    ports:
      - "5432:5432"
    volumes:
      - leadscout-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadscout -d leadscout"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Local SMTP sink for testing auto campaigns. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  leadscout-db:
